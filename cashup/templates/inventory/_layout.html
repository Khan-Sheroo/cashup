{% extends "base.html" %}

{% block extra_css %}
<style>
    .container.mt-4 { max-width: 1320px; }
    .inv-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        margin-bottom: 1rem;
        border: 1px solid #333;
        width: fit-content;
    }
    .inv-nav a {
        padding: 0.4rem 0.9rem;
        color: #111;
        text-decoration: none;
        border-right: 1px solid #333;
        font-size: 0.9rem;
        font-weight: 600;
        background: #fff;
    }
    .inv-nav a:last-child { border-right: none; }
    .inv-nav a.active { background: #111; color: #fff; }
    .inv-nav a:hover:not(.active) { background: #f1f1f1; }
    .work-sheet {
        background: #fff;
        color: #111;
        padding: 1.5rem;
        border: 1px solid #333;
    }
    .work-sheet h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .work-sheet .sheet-meta {
        color: #555;
        margin-bottom: 1rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem 1.25rem;
    }
    .work-sheet h2 {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 2px solid #111;
        padding-bottom: 0.35rem;
        margin: 1.25rem 0 0.75rem;
    }
    .sheet-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
        background: #fff;
    }
    .sheet-table th, .sheet-table td {
        border: 1px solid #333;
        padding: 0.3rem 0.45rem;
        vertical-align: middle;
    }
    .sheet-table thead th {
        background: #f1f1f1;
        font-weight: 700;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 1;
    }
    .sheet-table .col-center { text-align: center; }
    .sheet-table .col-right { text-align: right; white-space: nowrap; }
    .sheet-table tr.cat-row td {
        background: #e9e9e9;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
    }
    .sheet-table select, .sheet-table input[type="text"], .sheet-table input[type="number"] {
        border: 1px solid #333;
        border-radius: 0;
        padding: 0.2rem 0.35rem;
        width: 100%;
        background: #fff;
        font-size: 0.88rem;
    }
    .sheet-table input.numeric-input { text-align: right; }
    .settings-field {
        border: 1px solid #333;
        padding: 0.6rem 0.75rem;
        background: #fff;
    }
    .settings-field .label {
        font-size: 0.72rem;
        text-transform: uppercase;
        color: #555;
        margin-bottom: 0.3rem;
        font-weight: 700;
    }
    .settings-field input, .settings-field select {
        border: 1px solid #333;
        border-radius: 0;
        padding: 0.3rem 0.5rem;
        background: #fff;
        width: 100%;
    }
    .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 0.75rem;
        margin-bottom: 0.75rem;
    }
    .sheet-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
        padding-top: 0.75rem;
        border-top: 2px solid #111;
    }
    .work-sheet .btn { border-radius: 0; border-width: 1px; }
    .btn-row { display: flex; flex-wrap: nowrap; gap: 0.3rem; white-space: nowrap; }
    .btn-row form { display: inline; margin: 0; }
    .btn-row .btn { padding: 0.15rem 0.45rem; font-size: 0.8rem; }
    .status-pill {
        display: inline-block;
        padding: 0.05rem 0.45rem;
        border: 1px solid #333;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
    }
    .status-confirmed { background: #111; color: #fff; }
    .status-draft { background: #fff; color: #111; }
    .over { background: #e6f4ea; }
    .under { background: #fbe9e9; }
    .txt-over { color: #146c2e; font-weight: 700; }
    .txt-under { color: #a61b1b; font-weight: 700; }
    .muted { color: #777; }
    .below-par { color: #a61b1b; font-weight: 700; }
    .totals-box {
        border: 2px solid #111;
        padding: 0.75rem 1rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.75rem;
        margin-bottom: 1rem;
    }
    .totals-box .t-label {
        font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em;
        color: #555; font-weight: 700;
    }
    .totals-box .t-value { font-size: 1.2rem; font-weight: 700; }
    .upload-box {
        border: 1px dashed #333;
        padding: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 1rem;
    }
    .upload-box input[type="file"] { max-width: 22rem; }
    .scroll-table { max-height: 70vh; overflow: auto; }
</style>
{% block inv_css %}{% endblock %}
{% endblock %}

{% block content %}
{% set ep = request.endpoint or '' %}
<div class="inv-nav">
    <a href="{{ url_for('inventory.stock') }}" class="{{ 'active' if ep in ('inventory.stock', 'inventory.adjust', 'inventory.item_movements') }}">Stock</a>
    <a href="{{ url_for('inventory.invoices') }}" class="{{ 'active' if 'invoice' in ep }}">Invoices</a>
    <a href="{{ url_for('inventory.requisitions') }}" class="{{ 'active' if 'requisition' in ep }}">Requisitions</a>
    <a href="{{ url_for('inventory.production') }}" class="{{ 'active' if 'production' in ep }}">Production</a>
    <a href="{{ url_for('inventory.sales') }}" class="{{ 'active' if 'sales' in ep }}">Sales Mix</a>
    <a href="{{ url_for('inventory.stocktakes') }}" class="{{ 'active' if 'stocktake' in ep or ep == 'inventory.variance' }}">Stock Takes</a>
    <a href="{{ url_for('recipes.list_items') }}">Items</a>
    <a href="{{ url_for('recipes.list_recipes') }}">Recipes</a>
    <a href="{{ url_for('inventory.testing_tools') }}" class="{{ 'active' if ep == 'inventory.testing_tools' }}">Testing</a>
</div>
{% block inv_content %}{% endblock %}
{% endblock %}

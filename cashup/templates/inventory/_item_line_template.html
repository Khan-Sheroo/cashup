<style>
    .item-search { position: relative; }
    .item-search-native {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: 0;
        opacity: 0;
        pointer-events: none;
    }
    .item-search-list {
        position: fixed;
        z-index: 40;
        max-height: 16rem;
        overflow: auto;
        background: #fff;
        border: 1px solid #333;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    }
    .item-search-cat {
        padding: 0.28rem 0.5rem;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: #f1f1f1;
        color: #333;
    }
    .item-search-option {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: #fff;
        padding: 0.32rem 0.5rem;
        font-size: 0.88rem;
    }
    .item-search-option.is-active,
    .item-search-option:hover { background: #e7eef8; }
    .item-search-option.is-selected { font-weight: 700; }
    .item-search-empty { padding: 0.45rem 0.5rem; color: #666; font-size: 0.85rem; }
</style>
<template id="line-template">
    <tr class="line-row">
        <td>
            <select name="line_item_id" class="line-item">
                <option value="">— select —</option>
                {% set ns = namespace(cat=None, open=False) %}
                {% for item in items %}
                    {% if loop.first or item.category != ns.cat %}
                        {% if ns.open %}</optgroup>{% endif %}
                        {% set ns.cat = item.category %}
                        <optgroup label="{{ item.category or 'Uncategorised' }}">
                        {% set ns.open = True %}
                    {% endif %}
                    <option value="{{ item.id }}" data-unit="{{ item.count_unit_label() }}"
                            data-base-unit="{{ item.unit }}" data-factor="{{ item.effective_count_factor()|float }}"
                            {% if store_stock is defined %}data-stock="{{ item.to_count_units(store_stock.get(item.id, 0))|qty }}"{% endif %}>{{ item.name }}</option>
                {% endfor %}
                {% if ns.open %}</optgroup>{% endif %}
            </select>
        </td>
        {% if unit_choice is defined and unit_choice %}
        <td class="col-center">
            <select name="line_unit" class="line-unit-select">
                <option value="count">—</option>
            </select>
        </td>
        {% else %}
        <td class="col-center line-unit"></td>
        {% endif %}
        {% if store_stock is defined %}<td class="col-right line-stock muted"></td>{% endif %}
        <td><input type="number" name="line_quantity" class="numeric-input" step="any"></td>
        <td class="col-center"><button type="button" class="btn btn-sm btn-outline-danger remove-line">&times;</button></td>
    </tr>
</template>
